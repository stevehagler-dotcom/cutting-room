// --- Supabase-backed storage shim ---
// Mirrors the same get/set/delete/list interface the app already expects,
// but persists to a Supabase Postgres table instead of localStorage —
// so data syncs across every device/browser that opens this URL.
const SUPABASE_URL = "https://yteekmqwzxsxqowhxqai.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_11VL8zKAlMWnBr3dAzktOg_nB3v4mJm";

function sbHeaders(extra) {
  return {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    ...extra,
  };
}

function setSyncStatus(text) {
  const el = document.getElementById("cr-status");
  if (el) el.textContent = text;
}

const saveTimers = {};

window.storage = {
  get: async (key) => {
    try {
      const res = await fetch(
        SUPABASE_URL + "/kv_store?key=eq." + encodeURIComponent(key) + "&select=value",
        { headers: sbHeaders() }
      );
      if (res.status === 429) {
        setSyncStatus("rate limited — using local copy");
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared: false } : null;
      }
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setSyncStatus("synced");
      if (data && data.length > 0) return { key, value: data[0].value, shared: false };
      // Supabase has no row yet (first time this device has synced) — fall back to
      // whatever's saved locally so existing data isn't lost, and let it migrate up
      // automatically on the next save.
      const localFallback = localStorage.getItem(key);
      return localFallback !== null ? { key, value: localFallback, shared: false } : null;
    } catch (e) {
      setSyncStatus("offline (local fallback)");
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v, shared: false } : null;
    }
  },
  // Debounced: rapid successive edits (typing, quick taps) coalesce into a single
  // network write ~700ms after the last change, instead of one request per change.
  set: (key, value) => {
    localStorage.setItem(key, value); // local copy is always saved immediately
    return new Promise((resolve) => {
      if (saveTimers[key]) clearTimeout(saveTimers[key]);
      saveTimers[key] = setTimeout(async () => {
        try {
          const res = await fetch(SUPABASE_URL + "/kv_store?on_conflict=key", {
            method: "POST",
            headers: sbHeaders({
              "Content-Type": "application/json",
              Prefer: "resolution=merge-duplicates,return=representation",
            }),
            body: JSON.stringify({ key, value }),
          });
          if (res.status === 429) {
            setSyncStatus("rate limited — saved locally, will retry");
            resolve({ key, value, shared: false });
            return;
          }
          if (!res.ok) throw new Error(await res.text());
          setSyncStatus("synced");
          resolve({ key, value, shared: false });
        } catch (e) {
          setSyncStatus("offline (saved locally only)");
          console.error("Supabase sync failed, saved locally instead:", e);
          resolve({ key, value, shared: false });
        }
      }, 700);
    });
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    try {
      await fetch(SUPABASE_URL + "/kv_store?key=eq." + encodeURIComponent(key), {
        method: "DELETE",
        headers: sbHeaders(),
      });
    } catch (e) {
      console.error("Supabase delete failed", e);
    }
    return { key, deleted: true, shared: false };
  },
  list: async (prefix) => {
    try {
      let url = SUPABASE_URL + "/kv_store?select=key";
      if (prefix) url += "&key=like." + encodeURIComponent(prefix) + "*";
      const res = await fetch(url, { headers: sbHeaders() });
      const data = await res.json();
      return { keys: data.map((d) => d.key), prefix, shared: false };
    } catch (e) {
      return { keys: [], prefix, shared: false };
    }
  },
};

/* ---------------- Photo handling ---------------- */
// Resizes an uploaded photo down to something small enough for localStorage,
// and samples its pixels to auto-suggest the closest matching-engine color.
function hexToRgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function nearestSwatchFromRgb(r, g, b) {
  let best = SWATCHES[0];
  let bestDist = Infinity;
  for (const s of SWATCHES) {
    const [sr, sg, sb] = hexToRgb(s.hex);
    const dist = (r - sr) ** 2 + (g - sg) ** 2 + (b - sb) ** 2;
    if (dist < bestDist) {
      bestDist = dist;
      best = s;
    }
  }
  return best;
}

function processPhotoFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const maxDim = 320;
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.7);

        const { data } = ctx.getImageData(0, 0, width, height);
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4 * 23) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        resolve({ dataUrl, suggestedColor: nearestSwatchFromRgb(r, g, b) });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- Matching engine ---------------- */
function hueDiff(a, b) {
  if (a == null || b == null) return null;
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function pairScore(a, b) {
  let score = 100;
  let hardClash = false;
  let bold = false;
  const reasons = [];

  if (a.color.neutral || b.color.neutral) {
    reasons.push(`${a.color.neutral ? a.color.name : b.color.name} is a neutral — pairs with almost anything.`);
  } else {
    const diff = hueDiff(a.color.hue, b.color.hue);
    if (diff <= 40) {
      reasons.push(`${a.color.name} and ${b.color.name} sit close on the color wheel — a calm, tonal pairing.`);
    } else if (diff >= 150) {
      bold = true;
      score -= 15;
      reasons.push(`${a.color.name} and ${b.color.name} are near-complementary — bold together, wear on purpose.`);
    } else {
      hardClash = true;
      score -= 45;
      reasons.push(`${a.color.name} and ${b.color.name} don't relate on the color wheel — this reads as a mistake, not a style choice. Skip this pairing.`);
    }
  }

  if (a.pattern !== "Solid" && b.pattern !== "Solid") {
    hardClash = true;
    score -= 35;
    reasons.push(`Two patterns (${a.pattern.toLowerCase()} + ${b.pattern.toLowerCase()}) are fighting each other — pick one to be the statement piece.`);
  }

  const fLevels = FORMALITY;
  const fGap = Math.abs(fLevels.indexOf(a.formality) - fLevels.indexOf(b.formality));
  if (fGap >= 2) {
    score -= 20;
    reasons.push(`${a.formality} meets ${b.formality} — a big formality jump.`);
  }

  return { score: Math.max(0, score), hardClash, bold, reasons };
}

function verdict(score, hardClash, bold) {
  if (hardClash) return { label: "Don't wear together", tone: "bad" };
  if (bold) return { label: "Bold — wear with intent", tone: "warn" };
  if (score >= 85) return { label: "Great match", tone: "good" };
  if (score >= 65) return { label: "Good pairing", tone: "good" };
  return { label: "Off", tone: "bad" };
}

// Groups match rows that are functionally identical (same category/color/pattern/formality) —
// duplicate items like three blue button-downs score identically, so show them as one row.
function groupMatches(matches) {
  const map = new Map();
  for (const m of matches) {
    const key = `${m.item.category}|${m.item.color.name}|${m.item.pattern}|${m.item.formality}`;
    if (!map.has(key)) {
      map.set(key, { key, items: [], score: m.score, hardClash: m.hardClash, bold: m.bold, reasons: m.reasons });
    }
    map.get(key).items.push(m.item);
  }
  return Array.from(map.values()).sort((a, b) => {
    if (a.hardClash !== b.hardClash) return a.hardClash ? 1 : -1;
    return b.score - a.score;
  });
}

// Scores a whole set of items pairwise — used for the outfit-ensemble preview.
function scoreOutfit(itemsArr) {
  if (itemsArr.length < 2) return null;
  const pairs = [];
  for (let i = 0; i < itemsArr.length; i++) {
    for (let j = i + 1; j < itemsArr.length; j++) {
      pairs.push({ a: itemsArr[i], b: itemsArr[j], ...pairScore(itemsArr[i], itemsArr[j]) });
    }
  }
  const avg = Math.round(pairs.reduce((s, p) => s + p.score, 0) / pairs.length);
  const anyClash = pairs.some((p) => p.hardClash);
  const worst = pairs.slice().sort((a, b) => a.score - b.score)[0];
  return { avg, pairs, anyClash, worst };
}

/* ---------------- Component ---------------- */
function ClosetMatcher() {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("closet"); // closet | add | build | check
  const [selectedBase, setSelectedBase] = useState(null);
  const [checkSelection, setCheckSelection] = useState([]);
  const [editingId, setEditingId] = useState(null);

  const blankForm = {
    label: "",
    brand: "",
    category: "Top",
    color: SWATCHES[0],
    pattern: "Solid",
    formality: "Casual",
    occasions: [],
    photo: null,
  };

  // form state
  const [form, setForm] = useState(blankForm);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) setItems(JSON.parse(res.value));
      } catch (e) {
        /* no saved closet yet */
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        console.error("Could not save closet", e);
      }
    })();
  }, [items, loaded]);

  const addItem = () => {
    if (!form.label.trim()) return;
    if (editingId) {
      setItems((prev) => prev.map((i) => (i.id === editingId ? { ...form, id: editingId } : i)));
      setEditingId(null);
    } else {
      const newItem = { ...form, id: Date.now().toString() };
      setItems((prev) => [...prev, newItem]);
    }
    setForm(blankForm);
    setTab("closet");
  };

  const startEdit = (item) => {
    setForm({ ...blankForm, ...item });
    setEditingId(item.id);
    setTab("add");
  };

  const startAddNew = () => {
    setForm(blankForm);
    setEditingId(null);
    setTab("add");
  };

  const cancelEdit = () => {
    setForm(blankForm);
    setEditingId(null);
    setTab("closet");
  };

  const loadSampleCloset = () => {
    const seeded = SAMPLE_ITEMS.map((it, idx) => ({ ...it, id: `sample-${idx}-${Date.now()}` }));
    setItems((prev) => [...prev, ...seeded]);
  };

  const loadRestoreCloset = () => {
    const seeded = RESTORE_ITEMS.map((it, idx) => ({ ...it, id: `restore-${idx}-${Date.now()}` }));
    setItems((prev) => [...prev, ...seeded]);
  };

  const removeItem = (id) => {
    setItems((prev) => prev.filter((i) => i.id !== id));
    setSelectedBase((b) => (b && b.id === id ? null : b));
    setCheckSelection((sel) => sel.filter((i) => i.id !== id));
    if (editingId === id) cancelEdit();
  };

  const grouped = useMemo(() => {
    const g = {};
    CATEGORIES.forEach((c) => (g[c] = []));
    items.forEach((i) => g[i.category] && g[i.category].push(i));
    return g;
  }, [items]);

  const matches = useMemo(() => {
    if (!selectedBase) return [];
    return items
      .filter((i) => i.id !== selectedBase.id)
      .map((i) => ({ item: i, ...pairScore(selectedBase, i) }))
      .sort((a, b) => {
        if (a.hardClash !== b.hardClash) return a.hardClash ? 1 : -1;
        return b.score - a.score;
      });
  }, [selectedBase, items]);

  const checkResult = useMemo(() => {
    if (checkSelection.length < 2) return null;
    const pairs = [];
    for (let i = 0; i < checkSelection.length; i++) {
      for (let j = i + 1; j < checkSelection.length; j++) {
        pairs.push({ a: checkSelection[i], b: checkSelection[j], ...pairScore(checkSelection[i], checkSelection[j]) });
      }
    }
    const avg = Math.round(pairs.reduce((s, p) => s + p.score, 0) / pairs.length);
    const anyClash = pairs.some((p) => p.hardClash);

    // Find the weakest-performing piece — the one dragging the outfit down the most.
    // Items involved in an actual clash are prioritized over items that are merely lower-scoring.
    const itemAvgs = checkSelection.map((item) => {
      const relevant = pairs.filter((p) => p.a.id === item.id || p.b.id === item.id);
      const m = relevant.reduce((s, p) => s + p.score, 0) / relevant.length;
      const hasClash = relevant.some((p) => p.hardClash);
      return { item, avg: m, hasClash };
    });
    itemAvgs.sort((x, y) => {
      if (x.hasClash !== y.hasClash) return x.hasClash ? -1 : 1;
      return x.avg - y.avg;
    });
    const weakLink = itemAvgs[0];

    let suggestion = null;
    if (weakLink && (weakLink.hasClash || weakLink.avg < 82)) {
      const rest = checkSelection.filter((i) => i.id !== weakLink.item.id);
      const candidates = items.filter(
        (i) => i.category === weakLink.item.category && !checkSelection.find((s) => s.id === i.id)
      );
      const scored = candidates
        .map((c) => {
          const pairResults = rest.map((r) => pairScore(c, r));
          const m = pairResults.length
            ? pairResults.reduce((s, p) => s + p.score, 0) / pairResults.length
            : 100;
          const hasClash = pairResults.some((p) => p.hardClash);
          return { candidate: c, avg: m, hasClash };
        })
        .sort((x, y) => {
          if (x.hasClash !== y.hasClash) return x.hasClash ? 1 : -1;
          return y.avg - x.avg;
        });
      const best = scored[0];
      const meaningfullyBetter =
        best && ((weakLink.hasClash && !best.hasClash) || (!best.hasClash && best.avg > weakLink.avg + 8));
      if (meaningfullyBetter) {
        suggestion = {
          weak: weakLink.item,
          weakScore: Math.round(weakLink.avg),
          replacement: best.candidate,
          newScore: Math.round(best.avg),
        };
      } else if (!best) {
        suggestion = { noAlternative: true, weak: weakLink.item };
      }
    }

    return { avg, pairs, suggestion, anyClash };
  }, [checkSelection, items]);

  const toggleCheckItem = (item) => {
    setCheckSelection((prev) =>
      prev.find((i) => i.id === item.id) ? prev.filter((i) => i.id !== item.id) : [...prev, item]
    );
  };

  const swapCheckItem = (oldItem, newItem) => {
    setCheckSelection((prev) => prev.filter((i) => i.id !== oldItem.id).concat(newItem));
  };

  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        button { font-family: inherit; cursor: pointer; }
        input, select { font-family: inherit; }
      `}</style>

      <header style={styles.header}>
        <div style={styles.pin} />
        <h1 style={styles.title}>The Cutting Room</h1>
        <p style={styles.subtitle}>a closet that tells you what matches</p>
      </header>

      <nav style={styles.nav}>
        {[
          ["closet", "Closet"],
          ["add", "Add item"],
          ["build", "Build outfit"],
          ["check", "Check outfit"],
        ].map(([key, label]) => (
          <button
            key={key}
            onClick={() => (key === "add" ? startAddNew() : setTab(key))}
            style={{
              ...styles.navBtn,
              ...(tab === key ? styles.navBtnActive : {}),
            }}
          >
            {label}
          </button>
        ))}
      </nav>

      <main style={styles.main}>
        {tab === "closet" && (
          <ClosetView
            grouped={grouped}
            onRemove={removeItem}
            onEdit={startEdit}
            onAdd={startAddNew}
            onLoadSample={loadSampleCloset}
            onRestore={loadRestoreCloset}
          />
        )}

        {tab === "add" && (
          <AddForm
            form={form}
            setForm={setForm}
            onSubmit={addItem}
            isEditing={!!editingId}
            onCancel={cancelEdit}
            onDelete={() => removeItem(editingId)}
          />
        )}

        {tab === "build" && (
          <BuildOutfit
            items={items}
            selectedBase={selectedBase}
            setSelectedBase={setSelectedBase}
            matches={matches}
          />
        )}

        {tab === "check" && (
          <CheckOutfit
            items={items}
            checkSelection={checkSelection}
            toggleCheckItem={toggleCheckItem}
            checkResult={checkResult}
            onSwap={swapCheckItem}
          />
        )}
      </main>
    </div>
  );
}

function GarmentIcon({ category, color, pattern, uid, size = 44 }) {
  const patternId = `pat-${uid}`;
  const d = GARMENT_PATHS[category] || GARMENT_PATHS.Top;
  const fill = pattern === "Solid" ? color : `url(#${patternId})`;
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" style={{ flexShrink: 0 }}>
      <defs>
        <pattern
          id={patternId}
          patternUnits="userSpaceOnUse"
          width="9"
          height="9"
          patternTransform={pattern === "Striped" ? "rotate(45)" : "rotate(0)"}
        >
          <rect width="9" height="9" fill={color} />
          {pattern === "Striped" && <rect width="4.5" height="9" fill="rgba(255,255,255,0.4)" />}
          {pattern === "Patterned" && <circle cx="4.5" cy="4.5" r="1.7" fill="rgba(255,255,255,0.5)" />}
        </pattern>
      </defs>
      <path d={d} fill={fill} stroke="rgba(0,0,0,0.35)" strokeWidth="1.5" strokeLinejoin="round" />
    </svg>
  );
}

function BuildOutfit({ items, selectedBase, setSelectedBase, matches }) {
  const [filter, setFilter] = useState("All");
  const [occFilter, setOccFilter] = useState([]);
  const [ensembleIds, setEnsembleIds] = useState(() => new Set());
  const [expandedGroups, setExpandedGroups] = useState(() => new Set());

  useEffect(() => {
    setEnsembleIds(new Set());
    setExpandedGroups(new Set());
  }, [selectedBase?.id]);

  const toggleEnsemble = (itemId) => {
    setEnsembleIds((prev) => {
      const next = new Set(prev);
      if (next.has(itemId)) next.delete(itemId);
      else next.add(itemId);
      return next;
    });
  };

  const toggleExpand = (key) => {
    setExpandedGroups((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  if (items.length === 0) {
    return <p style={styles.emptyText}>Add a few items first, then pick one to build around.</p>;
  }
  let visible = filter === "All" ? items : items.filter((i) => i.category === filter);
  if (occFilter.length > 0) {
    visible = visible.filter((i) => i.occasions && i.occasions.some((o) => occFilter.includes(o)));
  }

  const groups = groupMatches(matches);
  const ensembleItems = selectedBase ? [selectedBase, ...items.filter((i) => ensembleIds.has(i.id))] : [];
  const ensembleScore = scoreOutfit(ensembleItems);

  return (
    <div>
      <h2 style={styles.sectionTitle}>Pick a piece to build around</h2>
      <CategoryFilter value={filter} onChange={setFilter} />
      <OccasionFilter value={occFilter} onChange={setOccFilter} />
      <div style={{ ...styles.grid, marginTop: 12 }}>
        {visible.map((item) => (
          <SwatchCard
            key={item.id}
            item={item}
            selected={selectedBase?.id === item.id}
            onClick={() => setSelectedBase(item)}
          />
        ))}
        {visible.length === 0 && <p style={styles.emptyText}>No matching items yet.</p>}
      </div>

      {selectedBase && (
        <>
          <EnsemblePreview
            items={ensembleItems}
            scoreResult={ensembleScore}
            onClear={() => setEnsembleIds(new Set())}
            onRemove={(id) => toggleEnsemble(id)}
            baseId={selectedBase.id}
          />

          <h2 style={styles.sectionTitle}>Matches for {selectedBase.label}</h2>
          <p style={styles.checkHint}>Tap a row to add it to the outfit preview above.</p>
          <div style={styles.matchList}>
            {groups.map((g) => {
              const v = verdict(g.score, g.hardClash, g.bold);
              const isGroup = g.items.length > 1;
              const expanded = expandedGroups.has(g.key);
              const primary = g.items[0];
              const anySelected = g.items.some((i) => ensembleIds.has(i.id));

              return (
                <div key={g.key}>
                  <div
                    style={{ ...styles.matchRow, ...(anySelected ? styles.matchRowActive : {}) }}
                    onClick={() => (isGroup ? toggleExpand(g.key) : toggleEnsemble(primary.id))}
                  >
                    <GarmentIcon category={primary.category} color={primary.color.hex} pattern={primary.pattern} uid={g.key} size={30} />
                    <div style={styles.matchInfo}>
                      <div style={styles.matchTop}>
                        <span style={styles.matchName}>
                          {primary.label}
                          {isGroup && <span style={styles.matchCount}> +{g.items.length - 1} more</span>}
                        </span>
                        <span style={{ ...styles.badge, ...styles[`badge_${v.tone}`] }}>{v.label}</span>
                      </div>
                      <div style={styles.matchReason}>{g.reasons[0]}</div>
                    </div>
                    {!isGroup && (
                      <span style={{ ...styles.addCircle, ...(anySelected ? styles.addCircleOn : {}) }}>
                        {anySelected ? "✓" : "+"}
                      </span>
                    )}
                    {isGroup && <span style={styles.expandChevron}>{expanded ? "▲" : "▼"}</span>}
                  </div>

                  {isGroup && expanded && (
                    <div style={styles.groupExpand}>
                      {g.items.map((it) => {
                        const on = ensembleIds.has(it.id);
                        return (
                          <div
                            key={it.id}
                            style={styles.groupExpandRow}
                            onClick={(e) => {
                              e.stopPropagation();
                              toggleEnsemble(it.id);
                            }}
                          >
                            <span style={styles.groupExpandLabel}>
                              {it.label}
                              {it.brand && <span style={styles.groupExpandBrand}> · {it.brand}</span>}
                            </span>
                            <span style={{ ...styles.addCircle, ...(on ? styles.addCircleOn : {}) }}>
                              {on ? "✓" : "+"}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

function EnsemblePreview({ items, scoreResult, onClear, onRemove, baseId }) {
  const ordered = CATEGORY_ORDER.map((cat) => items.find((i) => i.category === cat)).filter(Boolean);
  // include any categories not in the standard order, just in case

  const tiles = [...ordered, ...extra];

  return (
    <div style={styles.ensembleCard}>
      <div style={styles.ensembleHeader}>
        <span style={styles.ensembleTitle}>Your outfit</span>
        {items.length > 1 && (
          <button style={styles.ensembleClear} onClick={onClear}>
            clear extras
          </button>
        )}
      </div>

      <div style={styles.ensembleTiles}>
        {tiles.map((item) => (
          <div key={item.id} style={styles.ensembleTile}>
            {item.photo ? (
              <img src={item.photo} alt={item.label} style={styles.ensembleTilePhoto} />
            ) : (
              <div style={styles.ensembleTileIconWrap}>
                <GarmentIcon category={item.category} color={item.color.hex} pattern={item.pattern} uid={"ens-" + item.id} size={54} />
              </div>
            )}
            <div style={styles.ensembleTileLabel}>{item.label}</div>
            {item.id !== baseId && (
              <span style={styles.ensembleTileRemove} onClick={() => onRemove(item.id)}>
                ✕
              </span>
            )}
          </div>
        ))}
      </div>

      {scoreResult ? (
        <div style={styles.ensembleScoreRow}>
          <span style={styles.ensembleScoreNum}>{scoreResult.avg}</span>
          <span
            style={{
              ...styles.badge,
              ...styles[`badge_${verdict(scoreResult.avg, scoreResult.anyClash).tone}`],
            }}
          >
            {verdict(scoreResult.avg, scoreResult.anyClash).label}
          </span>
          {scoreResult.anyClash && (
            <span style={styles.ensembleWorstNote}>{scoreResult.worst.reasons[0]}</span>
          )}
        </div>
      ) : (
        <p style={styles.ensembleHint}>Tap matches below to add them here and build the full look.</p>
      )}
    </div>
  );
}

function CheckOutfit({ items, checkSelection, toggleCheckItem, checkResult, onSwap }) {
  const [filter, setFilter] = useState("All");
  const [occFilter, setOccFilter] = useState([]);
  if (items.length === 0) {
    return <p style={styles.emptyText}>Add a few items first, then select today's outfit to check it.</p>;
  }
  let visible = filter === "All" ? items : items.filter((i) => i.category === filter);
  if (occFilter.length > 0) {
    visible = visible.filter((i) => i.occasions && i.occasions.some((o) => occFilter.includes(o)));
  }
  return (
    <div>
      <div style={styles.checkHeaderRow}>
        <h2 style={{ ...styles.sectionTitle, marginBottom: 0 }}>Select today's outfit</h2>
        <span style={styles.selectedCount}>
          {checkSelection.length} selected
        </span>
      </div>
      <p style={styles.checkHint}>Tap each piece you're wearing — they'll stack up with a ✓.</p>
      <CategoryFilter value={filter} onChange={setFilter} />
      <OccasionFilter value={occFilter} onChange={setOccFilter} />
      <div style={{ ...styles.grid, marginTop: 12 }}>
        {visible.map((item) => (
          <SwatchCard
            key={item.id}
            item={item}
            showCheck
            selected={!!checkSelection.find((i) => i.id === item.id)}
            onClick={() => toggleCheckItem(item)}
          />
        ))}
        {visible.length === 0 && <p style={styles.emptyText}>No matching items yet.</p>}
      </div>

      {checkResult && (
        <div style={styles.resultCard}>
          <div style={styles.resultHeader}>
            <span style={styles.resultScore}>{checkResult.avg}</span>
            <span
              style={{
                ...styles.badge,
                ...styles[`badge_${verdict(checkResult.avg, checkResult.anyClash).tone}`],
              }}
            >
              {verdict(checkResult.avg, checkResult.anyClash).label}
            </span>
          </div>
          <div style={styles.resultList}>
            {checkResult.pairs
              .slice()
              .sort((a, b) => {
                if (a.hardClash !== b.hardClash) return a.hardClash ? -1 : 1;
                return a.score - b.score;
              })
              .map((p, idx) => {
                const pv = verdict(p.score, p.hardClash, p.bold);
                return (
                  <div key={idx} style={styles.resultLine}>
                    <div style={styles.resultLineTop}>
                      <span style={styles.resultLineNames}>
                        {p.a.label} + {p.b.label}
                      </span>
                      <span style={{ ...styles.badge, ...styles[`badge_${pv.tone}`] }}>{pv.label}</span>
                    </div>
                    <span style={styles.resultLineReason}>{p.reasons[0]}</span>
                  </div>
                );
              })}
          </div>

          {checkResult.suggestion && checkResult.suggestion.replacement && (
            <div style={styles.suggestionBox}>
              <div style={styles.suggestionLabel}>Try this instead</div>
              <div style={styles.suggestionRow}>
                <GarmentIcon
                  category={checkResult.suggestion.weak.category}
                  color={checkResult.suggestion.weak.color.hex}
                  pattern={checkResult.suggestion.weak.pattern}
                  uid={checkResult.suggestion.weak.id}
                  size={30}
                />
                <span style={styles.suggestionArrow}>→</span>
                <GarmentIcon
                  category={checkResult.suggestion.replacement.category}
                  color={checkResult.suggestion.replacement.color.hex}
                  pattern={checkResult.suggestion.replacement.pattern}
                  uid={checkResult.suggestion.replacement.id}
                  size={30}
                />
                <div style={{ flex: 1 }}>
                  <div style={styles.suggestionText}>
                    Swap <strong>{checkResult.suggestion.weak.label}</strong> for{" "}
                    <strong>{checkResult.suggestion.replacement.label}</strong>
                  </div>
                  <div style={styles.suggestionScoreLine}>
                    {checkResult.suggestion.weakScore} → {checkResult.suggestion.newScore}
                  </div>
                </div>
              </div>
              <button
                style={styles.swapBtn}
                onClick={() => onSwap(checkResult.suggestion.weak, checkResult.suggestion.replacement)}
              >
                Swap it in
              </button>
            </div>
          )}

          {checkResult.suggestion && checkResult.suggestion.noAlternative && (
            <div style={styles.suggestionBox}>
              <div style={styles.suggestionText}>
                <strong>{checkResult.suggestion.weak.label}</strong> is the weak link, but nothing else in your{" "}
                {checkResult.suggestion.weak.category.toLowerCase()} category would do better — consider pinning a
                neutral (black, navy, grey, or beige) {checkResult.suggestion.weak.category.toLowerCase()} to your
                closet.
              </div>
            </div>
          )}

          {!checkResult.suggestion && (
            <div style={styles.suggestionBoxGood}>This combination is already working well — no swap needed.</div>
          )}
        </div>
      )}
    </div>
  );
}
